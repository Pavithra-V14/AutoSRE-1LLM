name: CI

# unit          every push / PR   offline, no secrets, seconds
# replay-smoke  every push / PR   the benchmark's smoke subset replayed from recorded
#                                 LLM responses: deterministic, free, no secrets
# nightly       schedule / manual live benchmark, 3 runs per scenario, compared to a baseline
#
# The old workflow ran the whole live benchmark on every push: slow, flaky
# (LLM variance), and dependent on free-tier quota that a single run can exhaust.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per scenario for the live benchmark"
        default: "3"

env:
  SIMULATOR_BASE_URL: http://localhost:8100

jobs:
  unit:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (offline -- JSON repair, dedupe, scoring, guardrails, replay, CLI)
        run: python -m pytest tests -q

      - name: Adversarial guardrail cases (injection / PII)
        run: python tools/test_guardrails.py

  replay-smoke:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Look for recorded LLM responses
        id: fixtures
        run: |
          if ls tests/fixtures/llm_replay/*.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No recordings in tests/fixtures/llm_replay -- skipping replay. Record with LLM_REPLAY_MODE=record (see README)."
          fi

      - name: Set up Python
        if: steps.fixtures.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.fixtures.outputs.present == 'true'
        run: pip install -r requirements.txt

      - name: Start simulator
        if: steps.fixtures.outputs.present == 'true'
        run: |
          nohup uvicorn services.simulator.main:app --port 8100 > sim.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8100/health && break || sleep 1; done

      - name: Smoke benchmark, replayed (no LLM calls)
        if: steps.fixtures.outputs.present == 'true'
        env:
          LLM_REPLAY_MODE: replay
        run: python tools/run_benchmark.py --smoke --min-success-rate 1.0  # deterministic: any failure is a code regression

  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start simulator
        run: |
          nohup uvicorn services.simulator.main:app --port 8100 > sim.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8100/health && break || sleep 1; done

      - name: Live benchmark vs baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
        run: |
          python tools/run_benchmark.py \
            --runs "${{ github.event.inputs.runs || '3' }}" \
            --baseline benchmarks/baseline.json \
            --output benchmark-results.json

      - name: Judge calibration
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
        run: python tools/calibrate_judge.py --min-agreement 0.7

      - name: Keep the results (commit as benchmarks/baseline.json once trusted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore
